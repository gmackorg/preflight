name: CI

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    # `apps`: the fleet's app-CI label (container runners with the
    # /go-cache and other fleet cache mounts).
    runs-on: apps
    timeout-minutes: 20
    steps:
      # Push to master: skip the heavy steps (and stay green) when master
      # already has a newer commit, whose own run verifies it. PRs always run.
      - name: Superseded?
        id: superseded
        uses: https://git.forgegraf.com/gmackie/ci-actions/fleet/superseded@ddd693744c0254b1cb078eec0e4d5a1bc38f57eb

      - uses: actions/checkout@v4
        if: steps.superseded.outputs.skip != 'true'

      # Go from go.mod, GOMODCACHE/GOCACHE on the runner's /go-cache mount
      # (instead of setup-go's archive cache), and `go mod download`.
      - name: Set up Go
        if: steps.superseded.outputs.skip != 'true'
        uses: https://git.forgegraf.com/gmackie/ci-actions/fleet/setup@ddd693744c0254b1cb078eec0e4d5a1bc38f57eb
        with:
          stacks: go

      - name: Install Jujutsu for source-binding integration tests
        if: steps.superseded.outputs.skip != 'true'
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/jj-vcs/jj/releases/download/v0.38.0/jj-v0.38.0-x86_64-unknown-linux-musl.tar.gz \
            --output /tmp/preflight-jj.tar.gz
          mkdir -p /tmp/preflight-jj
          tar -xzf /tmp/preflight-jj.tar.gz -C /tmp/preflight-jj
          JJ_BINARY="$(find /tmp/preflight-jj -type f -name jj -print -quit)"
          test -n "$JJ_BINARY"
          sudo install -m 0755 "$JJ_BINARY" /usr/local/bin/jj
          jj --version

      - name: Build
        if: steps.superseded.outputs.skip != 'true'
        run: go build ./...

      - name: Vet
        if: steps.superseded.outputs.skip != 'true'
        run: go vet ./...

      - name: Test
        if: steps.superseded.outputs.skip != 'true'
        run: go test ./...

      - name: Report CI result to ForgeGraph
        if: always() && steps.superseded.outputs.skip != 'true'
        uses: https://git.forgegraf.com/gmackie/ci-actions/fleet/report@ddd693744c0254b1cb078eec0e4d5a1bc38f57eb
        with:
          token: ${{ secrets.FORGEGRAPH_TOKEN }}
          status: ${{ job.status }}
          workflow-name: CI
